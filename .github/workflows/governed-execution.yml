name: Nova governed execution

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governed-execution-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prove runner execution
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=$(uname -a)"
          echo "python_available=$(command -v python3 || true)"
          test -n "${RUNNER_OS:-}"
          test -n "${GITHUB_SHA:-}"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact reviewed revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected_sha=${EXPECTED_SHA}"
          echo "actual_sha=${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.1.1

      - name: Verify P0.1 expected-result contract boundary
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings --tb=long tests/test_result_contract.py 2>&1 | tee result-contract.log

      - name: Verify P0.2 evidence identity and provenance boundary
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings --tb=long tests/test_evidence_provenance.py 2>&1 | tee evidence-provenance.log

      - name: Verify governed execution adversarial boundary
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings --tb=long tests/test_governed_execution_boundary.py 2>&1 | tee governed-execution-boundary.log

      - name: Verify Gate-2 governed execution and durability
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings --tb=long \
            tests/test_governed_execution.py \
            tests/test_legacy_execution_boundary.py \
            tests/test_internal_execution_escape_hatch.py \
            tests/test_execution.py \
            tests/test_execution_durability.py \
            tests/test_verification.py 2>&1 | tee gate-2.log

      - name: Verify recovery and adversarial invariants
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings --tb=long \
            tests/test_recovery.py \
            tests/test_adversarial_invariants.py 2>&1 | tee recovery-adversarial.log

      - name: Execute Issue #33 independent adversarial acceptance harness
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings --tb=long tests/test_issue33_adversarial_gate.py 2>&1 | tee issue-33-adversarial.log

      - name: Verify P2.1 runtime security enforcement
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings --tb=long             tests/test_runtime_security_gate.py             tests/test_p2_1_runtime_security_integration.py 2>&1 | tee p2-1-runtime-security.log

      - name: Verify all regression and security tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings --tb=long tests 2>&1 | tee full-regression.log

      - name: Verify syntax of all Python sources
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q nova tests 2>&1 | tee compileall.log

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nova-governed-execution-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            result-contract.log
            evidence-provenance.log
            governed-execution-boundary.log
            gate-2.log
            recovery-adversarial.log
            issue-33-adversarial.log
            p2-1-runtime-security.log
            full-regression.log
            compileall.log
          if-no-files-found: warn
          retention-days: 14
