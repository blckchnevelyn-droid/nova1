name: Nova file-write pilot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file-write-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact reviewed revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.1.1

      - name: Full suite
        run: python -m pytest -q --disable-warnings --tb=short

      - name: Golden transcript is unchanged
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python demo/file_write_pilot_demo.py | diff -u demo/expected_transcript.txt -

      - name: Model-check the pilot lifecycle (TLC, pinned v1.7.4, checksum verified)
        shell: bash
        run: |
          set -euo pipefail
          java -version
          TLA2TOOLS_JAR="$RUNNER_TEMP/tla2tools.jar" formal/run_tlc.sh

      - name: Race stress (20 repetitions of process-level suites)
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            python -m pytest -q --disable-warnings \
              tests/test_file_write_concurrency.py \
              tests/test_file_write_crash.py \
              tests/test_file_write_completion.py
          done
