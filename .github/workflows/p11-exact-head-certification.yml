name: Nova P1.1 exact-head certification evidence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p11-certification-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prove hosted runner and exact commit
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "github_sha=${GITHUB_SHA}"
          echo "github_ref=${GITHUB_REF}"
          test "${GITHUB_REF}" = "refs/heads/main"
          test -n "${GITHUB_SHA}"

      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          echo "checked_out_sha=${checked_out_sha}"
          test "${checked_out_sha}" = "${GITHUB_SHA}"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run full P1.1 test matrix
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings --tb=short tests 2>&1 | tee p11-full-regression.log

      - name: Verify Python syntax
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q nova tests 2>&1 | tee p11-compileall.log

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-p11-exact-head-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            p11-full-regression.log
            p11-compileall.log
          if-no-files-found: warn
          retention-days: 14
